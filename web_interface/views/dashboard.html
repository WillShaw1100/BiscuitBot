<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biscuit Bot Dashboard</title>

    <link rel="stylesheet" href="/style/dashboard.css">
</head>

<body>

    <div class="card">
        <img id="avatar" class="avatar" src="" alt="Avatar">

        <h1 id="username">Welcome</h1>

        <div class="info">
    <div>
        <strong>ID:</strong>
        <span id="userid"></span>
    </div>

    <div id="roleTag" class="tag"></div>
    </div>

    <ul id="permList" class="perm-list"></ul>

    <label for="guildSelect"><strong>Select Guild:</strong></label>
    <select id="guildSelect" class="guild-dropdown"></select>

        <a href="/scoreboard/manage-scoreboard" class="btn" id="manageBtn">
            Manage Scoreboard
        </a>
        <a href="/permissions/manage-permissions" class="btn" id="managePermsBtn" style="display:none;">
        Manage Permissions
        </a>
    </div>

    <script>
        window.user = {
            username: "{{username}}",
            id: "{{id}}",
            avatar: "{{avatar}}",
            canViewManage: "{{canViewManage}}",
            canAddScores: "{{canAddScores}}",
            canResetSeason: "{{canResetSeason}}",
            canEditHistorical: "{{canEditHistorical}}",
            canManagePermissions: "{{canManagePermissions}}",
            guilds: {{guilds}},
            selectedGuild: "{{selectedGuild}}"
        };
    </script>

    <script type="module" src="/scripts/pages/dashboard.js"></script>


</body>

</html>
